<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Font Preview - Jersey 10</title>
  <style>
    @font-face {
      font-family: 'Jersey 10';
      src: url('javafx/fonts/Jersey10-Regular.ttf');
    }
    body { background: #0f0b1e; color: #f6e9d5; font-family: 'Jersey 10', system-ui, sans-serif; padding: 40px; }
    h1 { font-size: 48px; margin: 12px 0; }
    h2 { font-size: 32px; margin: 8px 0; }
    p { font-size: 16px; max-width: 800px; }
    .sample { background: rgba(25,18,49,0.9); padding: 18px; border-radius: 8px; display:inline-block; }
  </style>
</head>
<body>
  <div class="sample">
    <h1>Jersey 10 — Heading 1</h1>
    <h2>Jersey 10 — Heading 2</h2>
    <p>This is a sample paragraph using the Jersey 10 Regular font. The quick brown fox jumps over the lazy dog. 0123456789</p>
    <p style="font-size:24px;">Bigger size: 24px — The quick brown fox jumps over the lazy dog.</p>
  </div>
</body>
</html>
